name: Security Audit & Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and reading contents
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Security Gate: Scan for exposed secrets and credential leaks
  security-scan:
    name: Secret Exposure & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Deterministic Secret Exposure Verification Gate
        shell: pwsh
        run: |
          pwsh -File ./scripts/test-secrets-exposure.ps1

  # 2. Deploy Documentation to GitHub Pages (gated on security-scan passing)
  deploy:
    name: Deploy Documentation
    needs: security-scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'docs/package-lock.json'

      - name: Install Dependencies & Build
        run: |
          cd docs
          npm ci
          npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
